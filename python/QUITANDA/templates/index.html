<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quitanda Pro | Gestão de Estoque</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="saas-container">
        
        <header class="saas-header">
            <div>
                <h1 class="saas-title"><i class="bi bi-shop text-primary me-2"></i>Quitanda do Tomate Cru</h1>
                <p class="saas-subtitle">Painel de Controle e Gestão de Inventário</p>
            </div>
            <div>
                <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill">
                    <i class="bi bi-circle-fill me-1" style="font-size: 8px;"></i> Sistema Online
                </span>
            </div>
        </header>

        <div class="row">
            <div class="col-lg-4">
                <div class="saas-card">
                    <h2 class="card-title-saas" id="form-action-title">
                        <i class="bi bi-plus-circle me-2"></i>Cadastrar Produto
                    </h2>
                    
                    <input type="hidden" id="id">

                    <div class="mb-3">
                        <label class="form-label-saas">Nome do Item</label>
                        <input id="nome" type="text" class="form-control-saas w-100" placeholder="Ex: Tomate Cereja">
                    </div>

                    <div class="mb-3">
                        <label class="form-label-saas">Marca / Produtor</label>
                        <input id="marca" type="text" class="form-control-saas w-100" placeholder="Ex: Orgânicos S.A.">
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label-saas">Preço (R$)</label>
                            <input id="preco" type="number" step="0.01" class="form-control-saas w-100" placeholder="0.00">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label-saas">Qtd. Estoque</label>
                            <input id="quantidade" type="number" class="form-control-saas w-100" placeholder="0">
                        </div>
                    </div>

                    <button class="btn-saas-primary mt-2" onclick="gravar_dados()">
                        <i class="bi bi-check-lg me-1"></i> Salvar Produto
                    </button>
                </div>

                <div id="mensagem" class="alert d-none animate fade-in"></div>
            </div>

            <div class="col-lg-8">
                <div class="table-responsive-saas">
                    <table class="table table-saas align-middle">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Produto</th>
                                <th>Marca</th>
                                <th>Preço</th>
                                <th style="width: 110px;">Qtd.</th>
                                <th style="text-align: right; width: 140px;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-produtos">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="/static/requests.js"></script>

</body>
</html>
